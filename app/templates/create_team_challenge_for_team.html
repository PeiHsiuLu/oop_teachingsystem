{% extends "base.html" %}
{% block title %}Create Challenge｜建立挑戰{% endblock %}
{% block content %}

<style>
    .challenge-form-page { max-width: 780px; margin: 0 auto; animation: fadeIn .45s ease both; }
    .challenge-hero { padding:1.5rem; border-radius:24px; background:linear-gradient(135deg,#007bff,#4f46e5 55%,#7c3aed); color:#fff; margin-bottom:1.2rem; }
    .challenge-hero h2 { margin:0; font-size:1.9rem; font-weight:950; }
    .challenge-hero p { margin:.65rem 0 0; line-height:1.7; opacity:.95; }
    .form-card { background:#fff; border:1px solid #e5e7eb; border-radius:22px; padding:1.35rem; box-shadow:0 12px 28px rgba(15,23,42,.06); }
    .form-group { margin-bottom:1rem; }
    .form-label { display:block; margin-bottom:.4rem; color:#374151; font-weight:950; }
    .form-control { width:100%; padding:.78rem .9rem; border:1px solid #d1d5db; border-radius:12px; font-size:1rem; box-sizing:border-box; }
    .form-control:focus { outline:none; border-color:#007bff; box-shadow:0 0 0 4px rgba(0,123,255,.14); }
    .actions { display:flex; gap:.75rem; flex-wrap:wrap; margin-top:1.1rem; }
    .submit-btn, .cancel-btn { display:inline-flex; align-items:center; justify-content:center; padding:.75rem 1rem; border-radius:14px; font-weight:950; text-decoration:none; border:none; cursor:pointer; }
    .submit-btn { background:#007bff; color:#fff; }
    .submit-btn:hover { background:#0069d9; }
    .cancel-btn { background:#6c757d; color:#fff; }
    .cancel-btn:hover { background:#5a6268; color:#fff; text-decoration:none; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
</style>

<div class="challenge-form-page">
    <section class="challenge-hero">
        <h2>Create Challenge for {{ team.name }}<br>為 {{ team.name }} 建立挑戰</h2>
        <p>Create a shared learning goal for this team.<br>為這個團隊建立共同學習目標。</p>
    </section>

    <form method="POST" class="form-card">
        <div class="form-group">
            <label class="form-label">Challenge Title｜挑戰名稱</label>
            <input class="form-control" type="text" name="title" required>
        </div>
        <div class="form-group">
            <label class="form-label">Description｜挑戰描述</label>
            <input class="form-control" type="text" name="description">
        </div>
        <div class="form-group">
            <label class="form-label">Target XP｜目標經驗值</label>
            <input class="form-control" type="number" name="target_value" required>
        </div>
        <div class="form-group">
            <label class="form-label">Reward XP｜獎勵經驗值</label>
            <input class="form-control" type="number" name="reward_xp" value="0">
        </div>
        <div class="form-group">
            <label class="form-label">Reward Credit｜獎勵信用分數</label>
            <input class="form-control" type="number" name="reward_credit" value="0">
        </div>
        <div class="form-group">
            <label class="form-label">Deadline｜截止日期</label>
            <input class="form-control" type="date" name="deadline" required>
        </div>
        <div class="actions">
            <button type="submit" class="submit-btn">Create Challenge｜建立挑戰</button>
            <a href="{{ url_for('team.team_detail', group_id=team.id) }}" class="cancel-btn">Cancel｜取消</a>
        </div>
    </form>
</div>

{% endblock %}
