{% extends "base.html" %}
{% block content %}
<h2>Edit Chapter: {{ chapter.title }}</h2>
<form method="POST">
    <input type="text" name="title" value="{{ chapter.title }}" required>
    
    <select name="rule_type">
        <option value="none" {% if chapter.unlock_rule_type == 'none' %}selected{% endif %}>No Unlock Rule</option>
        <option value="level" {% if chapter.unlock_rule_type == 'level' %}selected{% endif %}>Level Required</option>
        <option value="score" {% if chapter.unlock_rule_type == 'score' %}selected{% endif %}>Score Required</option>
    </select>
    
    <input type="number" name="threshold" value="{{ chapter.unlock_threshold }}" min="0">
    
    <button type="submit">Save Changes</button>
</form>
{% endblock %}
